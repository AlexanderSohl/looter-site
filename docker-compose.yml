# One-VM deploy: the game server plus Caddy for HTTPS.
#   1. Copy .env.example to .env and fill it in.
#   2. docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TRUST_PROXY: "1"
      COOKIE_SECURE: "1"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
    volumes:
      - looter-data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
volumes:
  looter-data:
  caddy-data:
